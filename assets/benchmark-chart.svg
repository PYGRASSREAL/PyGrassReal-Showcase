      <text x="35" y="102" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">49.00%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">chatgpt-5.6</text>
    </g>

