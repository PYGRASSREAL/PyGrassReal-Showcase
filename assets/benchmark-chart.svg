      <text x="35" y="108" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">46.00%</text>
      <text x="35" y="232" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">hanuman-1.5</text>
      <text x="35" y="248" fill="#38bdf8" font-size="10" text-anchor="middle">🌿 PyGrassReal</text>
    </g>

    <!-- gemini-3.5-flash: 44.00% -> height 88px (top=122) -->
    <g transform="translate(450, 0)">
      <rect x="0" y="122" width="70" height="88" rx="4" fill="url(#barGradPrimary)"/>
      <text x="35" y="112" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">44.00%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">gemini-3.5</text>
    </g>

    <!-- claude-fable-5: 43.50% -> height 87px (top=123) -->
    <g transform="translate(570, 0)">
      <rect x="0" y="123" width="70" height="87" rx="4" fill="url(#barGradPrimary)"/>
      <text x="35" y="113" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">43.50%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">claude-fable-5</text>
    </g>

    <!-- chatgpt-5.6-sol: 40.50% -> height 81px (top=129) -->
    <g transform="translate(690, 0)">
      <rect x="0" y="129" width="70" height="81" rx="4" fill="#334155"/>
      <text x="35" y="119" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">40.50%</text>
      <text x="35" y="232" fill="#64748b" font-size="11" text-anchor="middle">chatgpt-5.6</text>
