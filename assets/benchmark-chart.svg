<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background:#0b1320;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="barGradPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#0284c7" opacity="0.2"/>
    <path d="M4 18h3V6H4v12zm6 0h3V2h-3v16zm6 0h3v-8h-3v8z" fill="#38bdf8" transform="translate(0, 1) scale(1.1)"/>
    <text x="32" y="18" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="0.5">AI Benchmark Designer &amp; Computational CAD Leaderboard</text>
    <text x="32" y="38" fill="#64748b" font-size="12">ผลการทดสอบประสิทธิภาพ AI สดจาก pygrassreal.ai/dashboard/benchmark</text>
  </g>

  <!-- Section 1: Q_01 Designer -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="840" height="260" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="32" fill="#94a3b8" font-size="14" font-weight="600">📊 Score (%) Q_01 Designer 200Q (AI Scorer)</text>
    
    <!-- Grid lines -->
    <line x1="60" y1="210" x2="800" y2="210" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="60" y1="160" x2="800" y2="160" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="60" y1="110" x2="800" y2="110" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="60" y1="60"  x2="800" y2="60"  stroke="#1e293b" stroke-dasharray="4"/>

    <!-- Y Axis Labels -->
    <text x="45" y="214" fill="#64748b" font-size="11" text-anchor="end">0</text>
    <text x="45" y="164" fill="#64748b" font-size="11" text-anchor="end">25</text>
    <text x="45" y="114" fill="#64748b" font-size="11" text-anchor="end">50</text>
    <text x="45" y="64"  fill="#64748b" font-size="11" text-anchor="end">75</text>

    <!-- Bars for Q_01 -->
    <!-- phralak-1.5: 50.00% -> height 100px from y=210 (top=110) -->
    <g transform="translate(90, 0)">
