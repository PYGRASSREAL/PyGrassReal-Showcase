    <g transform="translate(570, 0)">
      <rect x="0" y="113" width="70" height="97" rx="4" fill="url(#barGradPrimary)"/>
      <text x="35" y="103" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">48.50%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">gemini-3.5</text>
    </g>

