    <g transform="translate(690, 0)">
      <rect x="0" y="114" width="70" height="96" rx="4" fill="url(#barGradPrimary)"/>
      <text x="35" y="104" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">48.00%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">claude-fable-5</text>
    </g>
  </g>

  <!-- Section 2: Q_03 Workflownode & Q_02 Codecad2D -->
  <g transform="translate(30, 380)" filter="url(#cardShadow)">
    <rect width="840" height="260" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="32" fill="#94a3b8" font-size="14" font-weight="600">📈 Score (%) Q_03 Workflownode 200Q (Visual Node Programming)</text>
    
