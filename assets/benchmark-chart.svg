      <text x="35" y="100" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">50.00%</text>
      <text x="35" y="232" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">phralak-1.5</text>
      <text x="35" y="248" fill="#38bdf8" font-size="10" text-anchor="middle">🌿 PyGrassReal</text>
    </g>

    <!-- gemini-3.6-flash: 50.00% -->
    <g transform="translate(210, 0)">
      <rect x="0" y="110" width="70" height="100" rx="4" fill="url(#barGradPrimary)"/>
      <text x="35" y="100" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">50.00%</text>
      <text x="35" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">gemini-3.6</text>
    </g>

