<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="200" height="200" rx="42" fill="url(#logoBg)"/>
  <rect width="196" height="196" x="2" y="2" rx="40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- 3D Geometric Cube with Organic AI Leaf -->
  <g transform="translate(100, 95)" filter="url(#glow)">
    <!-- 3D Isometric Cube Faces -->
    <!-- Top Face -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="#38bdf8" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="-42,-24 0,0 0,48 -42,24" fill="#0284c7" opacity="0.85"/>
    <!-- Right Face -->
    <polygon points="0,0 42,-24 42,24 0,48" fill="#0369a1" opacity="0.95"/>

    <!-- Organic AI Sprout Leaf Overlay -->
    <path d="M0,0 C15,-30 40,-35 48,-15 C52,0 30,25 0,0 Z" fill="url(#leafGrad)" transform="translate(-10, -25) scale(0.9)"/>
    <path d="M0,0 C-10,-20 -25,-25 -32,-10 C-36,0 -20,18 0,0 Z" fill="#10b981" transform="translate(8, -18) scale(0.7)"/>
  </g>

  <!-- Brand Typography Subtext -->
  <text x="100" y="172" fill="#e2e8f0" font-size="14" font-weight="800" letter-spacing="3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">PYGRASSREAL</text>
</svg>
